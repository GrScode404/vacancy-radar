[project]
name = "vacancy-radar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bakunin_misha", email = "grigoryev.nhpt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.5",
]

[project.scripts]
vacancy-radar = "vacancy_radar:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# Кириллица в строках: «с», «о», «а» похожи на латиницу, RUF001–003 ругаются на каждую
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
